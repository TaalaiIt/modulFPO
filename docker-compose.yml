services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartdev-fpo-gateway:1.0.0
    restart: unless-stopped
    expose:
      - "8462"
    env_file:
      - path: .env.gateway
        required: false
    volumes:
      - smartdev-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8462/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  smartdev-data:
  caddy-data:
  caddy-config:
